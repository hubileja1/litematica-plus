plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "litematica_plus" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Jars placed in the "libs" folder (Litematica + MaLiLib) take priority over the Modrinth Maven versions.
def localLibs = fileTree(dir: 'libs', include: '*.jar').files

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    if (!localLibs.isEmpty()) {
        modImplementation files(localLibs)
    } else {
        modImplementation "maven.modrinth:malilib:${project.malilib_version}"
        modImplementation "maven.modrinth:litematica:${project.litematica_version}"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
